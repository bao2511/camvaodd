<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khám Phá Trải Nghiệm Mới</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-dark: #2d6a4f;
            --glass-card: rgba(255, 255, 255, 0.42);
            --glass-border: rgba(255, 255, 255, 0.75);
            --glass-shadow: 0 20px 50px rgba(45, 106, 79, 0.12);
            --ios-font: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--ios-font);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #d8f3dc;
        }

        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #e8f5e9, #d8f3dc, #b7e4c7, #f1faee);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            z-index: 1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.75;
            z-index: 2;
            animation: floatBlob 10s ease-in-out infinite alternate;
        }

        .blob-1 { width: 340px; height: 340px; background: #74c69d; top: 10%; left: 10%; }
        .blob-2 { width: 360px; height: 360px; background: #b7e4c7; bottom: 10%; right: 10%; animation-delay: -5s; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.2); }
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .glass-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            padding: 36px 28px;
            background: var(--glass-card);
            backdrop-filter: blur(35px) saturate(180%);
            -webkit-backdrop-filter: blur(35px) saturate(180%);
            border-radius: 36px;
            border: 1.5px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 2px 6px rgba(255, 255, 255, 0.95);
            text-align: center;
            animation: iosPopIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes iosPopIn {
            0% { opacity: 0; transform: scale(0.85) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #74c69d, #52b788);
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            box-shadow: 0 12px 24px rgba(82, 183, 136, 0.35);
        }

        .gift-box-icon {
            font-size: 80px;
            margin-bottom: 20px;
            cursor: pointer;
            animation: giftBounce 1.2s ease-in-out infinite alternate;
        }

        @keyframes giftBounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-15px) scale(1.1); }
        }

        .instruction-box {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.85);
        }

        .instruction-title {
            color: var(--green-dark);
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .instruction-text {
            color: #1b4332;
            font-size: 17px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        .ios-btn {
            flex: 1;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--ios-font);
            border-radius: 20px;
            border: none;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .btn-continue {
            background: linear-gradient(135deg, #52b788 0%, #2d6a4f 100%);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(45, 106, 79, 0.25);
        }

        .btn-exit {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            color: var(--green-dark);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        /* Màn hình Troll */
        #trollScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999;
            overflow: hidden;
        }

        /* Màn hình chớp nháy màu liên tục */
        .color-flash {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            animation: rainbowFlash 0.1s linear infinite;
        }

        @keyframes rainbowFlash {
            0% { background: #ff0000; }
            20% { background: #00ff00; }
            40% { background: #0000ff; }
            60% { background: #ffff00; }
            80% { background: #ff00ff; }
            100% { background: #00ffff; }
        }

        /* Ảnh chó zoom và xoay liên tục */
        .troll-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            max-width: 400px;
            z-index: 1000;
            animation: crazySpin 0.3s infinite linear alternate;
        }

        @keyframes crazySpin {
            0% { transform: translate(-50%, -50%) scale(0.8) rotate(-15deg); }
            100% { transform: translate(-50%, -50%) scale(1.3) rotate(15deg); }
        }

        /* Chữ DOG nhảy loạn xạ */
        #dogText {
            display: none;
            position: absolute;
            font-size: 65px;
            font-weight: 900;
            font-family: impact, sans-serif;
            color: yellow;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            z-index: 10005;
            pointer-events: none;
            white-space: nowrap;
            animation: fastBlink 0.1s infinite alternate;
        }

        @keyframes fastBlink {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="animated-bg"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <canvas id="particleCanvas"></canvas>

    <!-- Màn 1: Xác nhận -->
    <div id="step1" class="glass-card">
        <div class="icon-wrapper">✨</div>
        <div class="instruction-box">
            <div class="instruction-title">Xác Nhận</div>
            <div class="instruction-text">Bạn có muốn tiếp tục khám phá điều bất ngờ không?</div>
        </div>
        <div class="button-group">
            <button class="ios-btn btn-exit" onclick="goToGiftStep()">Thoát</button>
            <button class="ios-btn btn-continue" onclick="goToGiftStep()">Tiếp tục</button>
        </div>
    </div>

    <!-- Màn 2: Trang Hộp Quà -->
    <div id="step2" class="glass-card" style="display: none;">
        <div class="gift-box-icon" onclick="startTroll()">🎁</div>
        <div class="instruction-box">
            <div class="instruction-title">Phần Quà Bí Mật</div>
            <div class="instruction-text">Chạm vào hộp quà để mở điều bất ngờ!</div>
        </div>
        <button class="ios-btn btn-continue" style="width: 100%;" onclick="startTroll()">Mở Hộp Quà</button>
    </div>

    <!-- Màn 3: Màn Hình Trừng Phạt -->
    <div id="trollScreen" onclick="forcePlayAudio()">
        <div class="color-flash"></div>
        
        <!-- Ảnh chó được vẽ bằng mã (Không bao giờ lỗi) -->
        <svg class="troll-img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
           <circle cx="50" cy="50" r="45" fill="#f4a261"/>
           <circle cx="35" cy="40" r="12" fill="#fff"/>
           <circle cx="35" cy="40" r="4" fill="#000"/>
           <circle cx="65" cy="40" r="12" fill="#fff"/>
           <circle cx="65" cy="40" r="4" fill="#000"/>
           <ellipse cx="50" cy="65" rx="18" ry="12" fill="#e76f51"/>
           <path d="M40,70 Q50,85 60,70" stroke="#000" stroke-width="4" fill="transparent"/>
           <path d="M45,72 Q50,95 55,72" fill="#e63946"/> <!-- Lưỡi thè ra -->
           <ellipse cx="15" cy="30" rx="12" ry="30" fill="#264653" transform="rotate(-30 15 30)"/>
           <ellipse cx="85" cy="30" rx="12" ry="30" fill="#264653" transform="rotate(30 85 30)"/>
        </svg>

        <!-- Chữ DOG nhảy loạn -->
        <div id="dogText">DOG</div>
        
        <!-- Nhạc nền: Never Gonna Give You Up (Link chuẩn Archive.org) -->
        <audio id="audioTrack" src="https://archive.org/download/Rick_Astley_Never_Gonna_Give_You_Up/Rick_Astley_Never_Gonna_Give_You_Up.mp3" preload="auto" loop playsinline></audio>
    </div>

    <script>
        let audioTrack = document.getElementById('audioTrack');

        // Hàm mồi âm thanh (Hack qua mặt Safari/TikTok)
        function prepareAudio() {
            audioTrack.play().then(() => {
                audioTrack.pause();
                audioTrack.currentTime = 0;
            }).catch(() => {});
        }

        function goToGiftStep() {
            prepareAudio();
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }

        function forcePlayAudio() {
            audioTrack.play().catch(() => {});
        }

        function startTroll() {
            prepareAudio();
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'none';
            
            const trollScreen = document.getElementById('trollScreen');
            trollScreen.style.display = 'block';

            // Kích hoạt nhạc lớn hết cỡ
            audioTrack.volume = 1.0;
            const playPromise = audioTrack.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    const handleTouch = () => {
                        audioTrack.play();
                        document.removeEventListener('click', handleTouch);
                        document.removeEventListener('touchstart', handleTouch);
                    };
                    document.addEventListener('click', handleTouch);
                    document.addEventListener('touchstart', handleTouch);
                });
            }

            // Mở Full màn hình
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }

            // CODE CHO CHỮ "DOG" NHẢY LOẠN XẠ
            const dogText = document.getElementById('dogText');
            dogText.style.display = 'block';
            
            setInterval(() => {
                // Nhảy vị trí ngẫu nhiên
                dogText.style.top = (Math.random() * 80) + 'vh';
                dogText.style.left = (Math.random() * 70) + 'vw';
                
                // Đổi màu ngẫu nhiên cho hoa mắt
                const colors = ['#ffff00', '#ff0000', '#00ff00', '#00ffff', '#ff00ff', '#ffffff'];
                dogText.style.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Kéo giãn và nghiêng ngẫu nhiên
                dogText.style.transform = `rotate(${Math.random() * 360}deg) scale(${Math.random() * 1.5 + 0.5})`;
            }, 250); // Cứ 0.25 giây nhảy 1 lần
        }

        /* CODE NỀN HẠT CANVAS MÀN HÌNH CHÍNH */
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        for (let i = 0; i < 25; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 6 + 2,
                alpha: Math.random() * 0.5 + 0.2,
                speedY: Math.random() * 0.8 + 0.3,
                speedX: Math.sin(Math.random() * Math.PI) * 0.4
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
                p.y -= p.speedY;
                p.x += p.speedX;
                if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();
    </script>
</body>
</html>
