<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khám Phá Trải Nghiệm Mới</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-dark: #2d6a4f;
            --glass-card: rgba(255, 255, 255, 0.42);
            --glass-border: rgba(255, 255, 255, 0.75);
            --glass-shadow: 0 20px 50px rgba(45, 106, 79, 0.12);
            --ios-font: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: var(--ios-font); display: flex; justify-content: center; align-items: center; background: #d8f3dc; }

        /* Nền, Blob, Canvas giữ nguyên */
        .animated-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(-45deg, #e8f5e9, #d8f3dc, #b7e4c7, #f1faee); background-size: 400% 400%; animation: gradientMove 12s ease infinite; z-index: 1; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.75; z-index: 2; animation: floatBlob 10s ease-in-out infinite alternate; }
        .blob-1 { width: 340px; height: 340px; background: #74c69d; top: 10%; left: 10%; }
        .blob-2 { width: 360px; height: 360px; background: #b7e4c7; bottom: 10%; right: 10%; animation-delay: -5s; }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 40px) scale(1.2); } }
        #particleCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

        /* Card */
        .glass-card { position: relative; z-index: 10; width: 90%; max-width: 420px; padding: 36px 28px; background: var(--glass-card); backdrop-filter: blur(35px); border-radius: 36px; border: 1.5px solid var(--glass-border); text-align: center; }
        .gift-box-icon { font-size: 80px; margin-bottom: 20px; cursor: pointer; animation: giftBounce 1.2s ease-in-out infinite alternate; }
        @keyframes giftBounce { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-15px) scale(1.1); } }
        .btn-continue { width: 100%; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 20px; border: none; cursor: pointer; background: linear-gradient(135deg, #52b788 0%, #2d6a4f 100%); color: #ffffff; }

        /* --- MÀN HÌNH TROLL MỚI --- */
        #trollScreen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 999; overflow: hidden; }
        
        /* Hiệu ứng rung lắc khi bắt đầu */
        .shake { animation: shakeEffect 0.5s ease-in-out; }
        @keyframes shakeEffect {
            0% { transform: translate(10px, 10px); }
            20% { transform: translate(-10px, -10px); }
            40% { transform: translate(10px, -10px); }
            60% { transform: translate(-10px, 10px); }
            100% { transform: translate(0, 0); }
        }

        .dog-bubble { position: absolute; bottom: -60px; opacity: 0.7; animation: floatUp linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 20% { opacity: 0.85; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }

        /* Text DOG nháy mạnh và Zoom */
        .troll-center-content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; text-align: center;
            animation: zoomPulse 1.5s ease-in-out infinite alternate, flicker 0.2s linear infinite;
        }
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        @keyframes zoomPulse { 0% { transform: translate(-50%, -50%) scale(0.9); } 100% { transform: translate(-50%, -50%) scale(1.1); } }

        .big-dog-title { font-size: 85px; font-weight: 800; color: #ffeb3b; text-shadow: 0px 0px 20px rgba(255, 235, 59, 0.8); }
        .big-dog-icon { font-size: 110px; }
    </style>
</head>
<body>

    <div class="animated-bg"></div>
    <div id="step1" class="glass-card">
        <div style="font-size: 40px; margin-bottom: 15px;">✨</div>
        <div style="font-size: 18px; margin-bottom: 20px; font-weight: 600;">Bạn có muốn tiếp tục không?</div>
        <button class="btn-continue" onclick="document.getElementById('step1').style.display='none'; document.getElementById('step2').style.display='block';">Tiếp tục</button>
    </div>

    <div id="step2" class="glass-card" style="display: none;">
        <div class="gift-box-icon" onclick="startTroll()">🎁</div>
        <div style="font-size: 18px; margin-bottom: 20px;">Mở quà đi!</div>
    </div>

    <div id="trollScreen">
        <div id="dogBubbleContainer"></div>
        <div class="troll-center-content">
            <div class="big-dog-title">DOG</div>
            <div class="big-dog-icon">🐶</div>
        </div>
        <!-- Link Never Gonna Give You Up chuẩn -->
        <audio id="audioTrack" src="https://archive.org/download/Rick_Astley_Never_Gonna_Give_You_Up/Rick_Astley_Never_Gonna_Give_You_Up.mp3" loop playsinline></audio>
    </div>

    <script>
        function startTroll() {
            document.getElementById('step2').style.display = 'none';
            const screen = document.getElementById('trollScreen');
            screen.style.display = 'block';
            screen.classList.add('shake'); // Kích hoạt rung lắc
            
            document.getElementById('audioTrack').play().catch(()=>{});
            
            // Bong bóng chó
            setInterval(() => {
                const b = document.createElement('div');
                b.className = 'dog-bubble';
                b.innerText = '🐶';
                b.style.left = Math.random() * 90 + 'vw';
                b.style.fontSize = (Math.random() * 20 + 30) + 'px';
                b.style.animationDuration = (Math.random() * 3 + 3) + 's';
                document.getElementById('dogBubbleContainer').appendChild(b);
                setTimeout(() => b.remove(), 6000);
            }, 300);
        }
    </script>
</body>
</html>
